# midibridge configuration -- copy this file to config.yaml and edit
# for your install.

xr18:
  ip: auto               # mixer IP. Use a literal address (e.g. "192.168.1.100")
                         # for a fixed install, or "auto" (default if omitted) to
                         # discover the mixer on the LAN at startup via /xinfo
                         # broadcast. Auto-discovery picks the first X-Air mixer
                         # that replies -- set a static IP if you have more than
                         # one mixer on the same network.
  port: 10024            # XR18 OSC port (X-Air family uses 10024, NOT 10023)
  local_port: 10024      # Pi's local UDP port for receiving updates
                         # (must match XR18 port -- the mixer accepts control
                         # only from clients whose source port is 10024)

midi:
  port_name: X-Touch-Ext # substring match for the Extender's MIDI port name

# Fader mapping. Each Extender fader (1-8) drives one mixer target.
# Targets:
#   integer 1-16        = channel fader
#   "lr"                = main LR (house master)
#   "bus_1".."bus_6"    = aux/bus master
#   "dca_1".."dca_4"    = DCA group master
#   null                = inert (recognized but ignored)
faders:
  1: 1                   # channel 1
  2: 2                   # channel 2
  3: 3                   # channel 3
  4: 4                   # channel 4
  5: 5                   # channel 5
  6: 6                   # channel 6
  7: 7                   # channel 7
  8: lr                  # main LR (house master)

# Knob mapping. Knobs are *only* active when bridge is started with --setup,
# unless lock_trim_in_operation_mode is set to false (see below).
# Targets:
#   "trim_1".."trim_16" = channel preamp gain (input trim, -12dB..+60dB)
#   "bus_1".."bus_6"    = aux/bus master
#   "dca_1".."dca_4"    = DCA group master
#   null                = inert
knobs:
  1: trim_1
  2: trim_2
  3: trim_3
  4: trim_4
  5: trim_5
  6: trim_6
  7: trim_7
  8: null

# Mute mapping. Mute buttons toggle the target's mute. LEDs reflect mixer
# state: lit = muted, dark = unmuted.
# Targets:
#   "mute_1".."mute_16" = channel mute
#   "mute_lr"           = main LR mute (kills house audio)
#   null                = inert
mutes:
  1: mute_1
  2: mute_2
  3: mute_3
  4: mute_4
  5: mute_5
  6: mute_6
  7: mute_7
  8: mute_lr

# Scribble strip labels and colors.
#
# Two forms accepted:
#   N: ["TOP", "BOTTOM"]                                   # white bg, dark text
#   N: {top: "TOP", bottom: "BOT", background: red,
#       top_text: dark, bottom_text: dark}
#
# Colors: black, red, green, yellow, blue, magenta, cyan, white
# Text shade: dark or light (light = inverted / outlined text)
# Avoid black background -- it's unreadable on this LCD.
# Max 7 ASCII chars per row.
scribble:
  1: {top: "Vocal",   bottom: "1",    background: magenta}
  2: {top: "Vocal",   bottom: "2",    background: magenta}
  3: {top: "Guitar",  bottom: "",     background: cyan}
  4: {top: "Bass",    bottom: "",     background: cyan}
  5: {top: "Drums",   bottom: "L",    background: yellow}
  6: {top: "Drums",   bottom: "R",    background: yellow}
  7: {top: "Stereo",  bottom: "IN",   background: blue,  top_text: light, bottom_text: light}
  8: {top: "MASTER",  bottom: "LR",   background: red,   top_text: light, bottom_text: light}

# HTTP debug server. Visit http://<pi-ip>:8080/debug
debug_port: 8080

# Mirror map: when a primary target is moved, secondary targets get
# the same float value too. Use this if you want one fader to drive
# multiple targets in lockstep.
#
# Example: route channels independently to Main AND to bus 1-6, then
# enable this mirror so the Main fader drives all 7 masters together.
# Comment out (or set to {}) if you don't need this.
mirror: {}
# mirror:
#   lr: [bus_1, bus_2, bus_3, bus_4, bus_5, bus_6]

# After sound check, set to true to lock trim knobs in operation mode.
# Setup mode (bridge.py --setup) still works.
# Lifecycle:
#   1. Initial install: leave as false, dial in trim per channel
#   2. Once trims are dialed in: change to true, restart service
#   3. Future changes require ssh + manual --setup session
lock_trim_in_operation_mode: false

# FX mode. Hold knob 1 pushed in for hold_s seconds: the knobs become a
# reverb editor for FX slot fx_slot, fed from channel `channel`. Hold
# again to go back. Faders, mutes and the mirror map are not affected.
#   knob 1      channel's send level into the FX slot
#   knobs 2-8   reverb parameters, per type, from knob_maps below
#   knob 8 push (short) steps through the reverb types
# On entry the slot is set to default_type, unless it already holds a
# reverb and keep_current_reverb is true. A non-reverb on the slot is
# overwritten; its old type and parameters go to the /debug ring log.
# The FX return (and the slot's FX send master) are switched on and
# routed to LR; a level at -oo is raised to 0 dB, any other level kept.
# Reverb types (index, code, name):
#   0 HALL Hall Reverb    1 AMBI Ambience       2 RPLT Rich Plate
#   3 ROOM Room Reverb    4 CHAM Chamber        5 PLAT Plate Reverb
#   6 VREV Vintage Reverb 7 VRM  Vintage Room   8 GATE Gated Reverb
#   9 RVRS Reverse Reverb
# Parameter numbers per type: docs/FX-NOTES.md.
fx_mode:
  enabled: true
  hold_s: 1.0
  fx_slot: 1
  channel: 1
  default_type: "Vintage Reverb"   # name, code ("VREV") or index (6)
  keep_current_reverb: true        # false = always switch to default_type
  step_types_with_knob8: true      # remove/false if you don't want it
  color: green             # scribble colour in FX mode; not used by the strips above
  top_text: dark
  bottom_text: dark
  # Knobs 2..8 -> parameter numbers (/fx/1/par/NN). null = knob unused.
  knob_maps:
    "Hall Reverb":    [1, 2, 3, 4, 5, 7, 8]    # PreDly Decay Size Damping Diffuse LoCut HiCut
    "Ambience":       [1, 2, 3, 4, 5, 7, 8]
    "Rich Plate":     [1, 2, 3, 4, 5, 7, 8]
    "Room Reverb":    [1, 2, 3, 4, 5, 7, 8]
    "Chamber":        [1, 2, 3, 4, 5, 7, 8]
    "Plate Reverb":   [1, 2, 3, 4, 5, 7, 8]
    "Vintage Reverb": [1, 2, 3, 7, 8, 9, 10]   # PreDly Decay Mod LoCut HiCut LoMult HiMult
    "Vintage Room":   [1, 2, 3, 4, 5, 9, 10]   # RevDly Decay Size Density ERLevel LoCut HiCut
    "Gated Reverb":   [1, 2, 3, 4, 5, 7, 8]    # PreDly Decay Attack Density Spread LoCut HiCut
    "Reverse Reverb": [1, 2, 3, 4, 5, 7, 8]    # PreDly Decay Rise Diffuse Spread LoCut HiCut

# EQ mode. Hold knob hold_knob (2) pushed in for hold_s seconds: the
# knobs become a low/mid/high EQ editor for channel `channel` (1 =
# Headmic 1). Hold again to go back; the EQ stays as you set it.
# Holding knob 1 still goes to FX mode; the two modes are exclusive.
# Faders, mutes, the mirror map, bus mode and trim are not affected.
# Only the channel's EQ (/ch/01/eq/...) and low cut (/ch/01/preamp/hp...)
# are ever written.
#   knobs       what each knob turn sets (names below); null = unused
#   push_eq_onoff    short push: channel EQ on/off (bypass compare)
#   push_reset_band  short push: band of the last-turned knob to 0 dB
# Knob names: low_g low_f low_q mid_g mid_f mid_q high_g high_f high_q
# lowcut_f. Bands: the XR18 channel EQ has 4. low/mid/high_band pick
# which; the fourth is left alone. With shelves_on_entry, entering EQ
# mode makes the low band a low shelf and the high band a high shelf
# (a mid band that is a cut becomes a PEQ), because a cut filter has no
# gain. The old type goes to the /debug ring log. Facts and sources:
# docs/FX-NOTES.md, "Channel EQ".
eq_mode:
  enabled: true
  hold_knob: 2
  hold_s: 1.0
  channel: 1
  low_band: 1
  mid_band: 3
  high_band: 4
  shelves_on_entry: true
  color: white             # scribble colour in EQ mode; not the FX colour, not used above
  top_text: dark
  bottom_text: dark
  knobs:
    1: low_g               # LO G   low shelf gain
    2: low_f               # LO F   low shelf frequency
    3: mid_g               # MID G  mid gain
    4: mid_f               # MID F  mid frequency
    5: mid_q               # MID Q  mid Q (right = narrower)
    6: high_g              # HI G   high shelf gain
    7: high_f              # HI F   high shelf frequency
    8: lowcut_f            # LCUT   low cut frequency (turning it switches the low cut on)
  push_eq_onoff: 8         # null = no push
  push_reset_band: 5       # null = no push
  gain_step_db: 0.5        # per encoder tick
  freq_step_octaves: 0.1   # per tick (snapped to the mixer's grid: ~0.1 oct)
  q_steps: 1               # mixer Q steps per tick (~5% each)
  lowcut_step_octaves: 0.1
  lowcut_max_hz: 400       # top of the XR18 low-cut range (see FX-NOTES)
logging:
  level: INFO            # DEBUG | INFO | WARNING | ERROR
  ring_size: 500
